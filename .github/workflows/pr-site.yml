# Least-privilege pull-request CI for the static oui site.
#
# - Pull requests only (`pull_request`, not `pull_request_target`): fork code runs
#   with a read-only token, no secrets, no deploy or Pages step. The site has no
#   deployment and this workflow adds none.
# - `static` is native-free: it never runs Odin, native snippets, captures or
#   graphics; it checks pages/catalogue/links, builds VitePress and serves the
#   built dist over loopback.
# - `browser` needs Linux Chromium at /usr/bin/chromium with a working sandbox.
# - `native` is the separate required native gate (`npm run check:native`): it
#   executes the odin build/test commands published on the site and fails loudly
#   when the pinned toolchain is absent. It needs no `npm ci` (Node builtins only).
#   Required native environment: Odin dev-2026-10-nightly:84bc3fc, SDL3 3.4.16,
#   SDL3_ttf 3.2.2 and libpng 1.6.59 + zlib 1.4 in a private prefix, per
#   docs/resources.md. GitHub-hosted runners do not currently provide it here.
# - `check:catalogue:strict` is intentionally not wired in: it fails until all 19
#   gallery and four Lab IDs have records/media, so CI uses the declared sample.
# - Verified locally (Node 24.22.3, Chromium 152, pinned Odin). These jobs have not
#   been observed executing on GitHub-hosted runners from this change.
name: PR site checks
on:
  pull_request:
    paths:
      - 'site/**'
      - 'consumer/**'
      - 'kit/**'
      - 'resources/**'
      - '.github/workflows/pr-site.yml'
permissions:
  contents: read
jobs:
  static:
    name: static site (native-free)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Check, build and serve
        working-directory: site
        run: |
          npm ci
          npm run check
          npm run build
          npm run check:http
  browser:
    name: headless Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build and check in headless Chromium
        working-directory: site
        run: |
          npm ci
          npm run build
          npm run check:browser
  native:
    name: native snippets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
      - name: Execute published native snippets
        working-directory: site
        run: npm run check:native
